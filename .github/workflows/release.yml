name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag matching pubspec versionName (e.g. v2026.10.02)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Mocks
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate Database Migrations Schema
        run: flutter pub run drift_dev schema generate drift_schemas/ test/generated_migrations/

      - name: Run Tests
        run: flutter test

      - name: Require Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing required release signing secret: $variable"
              exit 1
            fi
          done

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          python3 -c "import os, base64; s = os.environ['KEYSTORE_BASE64']; s = ''.join(s.split()); m = len(s) % 4; s += '=' * (4 - m) if m else ''; open('android/my-release-key.jks', 'wb').write(base64.b64decode(s))"

      - name: Build Release APKs
        env:
          KEYSTORE_FILE: "../my-release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Build universal APK first
          flutter build apk --release --target-platform=android-arm,android-arm64
          # Rename/save it temporarily
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.apk.temp
          # Build split APKs
          flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64
          # Rename to final LTv-Extended-* names
          mv build/app/outputs/flutter-apk/app-release.apk.temp build/app/outputs/flutter-apk/LTv-Extended-universal-release.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/LTv-Extended-armeabi-v7a-release.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/LTv-Extended-arm64-v8a-release.apk

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Test In-App Update Metadata
        run: python3 -m unittest discover -s .github/scripts -p 'test_update_manifest.py'

      - name: Generate In-App Update Metadata
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: python3 .github/scripts/generate_update_manifest.py

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: python3 .github/scripts/generate_release_notes.py

      - name: Create Draft GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/LTv-Extended-universal-release.apk
            build/app/outputs/flutter-apk/LTv-Extended-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/LTv-Extended-arm64-v8a-release.apk
            update.json
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish only after all APKs and update metadata are available.
      - name: Publish Complete Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
